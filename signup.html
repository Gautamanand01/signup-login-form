<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="#" method="post">
      <h1>Signup form</h1>
      <div>
        <label for="fullname">Full Name</label> <br />
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="Enter your Name"
          required
        />
      </div>
      <div>
        <label for="signup-email">Email</label> <br />
        <input
          type="email"
          id="signup-email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>
      <div>
        <label for="phone">Phone number</label> <br />
        <input
          type="tel"
          id="phone"
          name="phone"
          maxlength="10"
          pattern="[0-9]{10}"
          placeholder="Enter your phone number "
          required
        />
      </div>
      <div>
        <label for="signup-password">Password</label> <br />
        <input
          type="password"
          id="signup-password"
          name="password"
          minlength="8"
          placeholder="Enter your password"
          required
        />
      </div>
      <div>
        <label for="confirm">Confirm Password</label> <br />
        <input
          type="password"
          id="confirm"
          name="confirm"
          placeholder="re-enter password"
          required
        />
      </div>
      <div>
       <p>Select Gender</p>
       <label><input type="radio" name="gender" value="male">Male</label>
       <label><input type="radio" name="gender" value="female">Female</label>
       <label><input type="radio" name="gender" value="other">Other</label>
      </div>
      <div>
        <p>Select your hobbies</p>
        <label><input type="checkbox" name="hobby" value="cricket">Cricket</label>
        <label><input type="checkbox" name="hobby" value="chess">Chess</label>
        <label><input type="checkbox" name="hobby" value="football">Football</label>
      </div>
      <br />
      <div>
        <button type="submit">Signup</button>
      </div>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </body>
</html>
